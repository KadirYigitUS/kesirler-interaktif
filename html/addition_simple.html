<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>➕ Kesir Toplama Görsel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #00b894;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .equation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .fraction-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            border-radius: 15px;
            color: white;
        }

        .fraction-box.result {
            background: linear-gradient(135deg, #00b894, #00cec9);
        }

        .fraction-box input {
            width: 60px;
            height: 45px;
            font-size: 1.8em;
            text-align: center;
            border: 3px solid white;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
        }

        .fraction-box .line {
            width: 60px;
            height: 4px;
            background: white;
            margin: 8px 0;
        }

        .fraction-box .val {
            font-size: 2em;
            font-weight: bold;
        }

        .operator {
            font-size: 3em;
            color: #2c3e50;
            font-weight: bold;
        }

        .visual-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 20px;
            margin: 30px 0;
        }

        .visual-section h3 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .bar-label {
            width: 80px;
            text-align: right;
            font-weight: bold;
            color: #2c3e50;
            font-size: 1.2em;
        }

        .fraction-bar {
            flex: 1;
            height: 50px;
            background: #ecf0f1;
            border-radius: 10px;
            display: flex;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .bar-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }

        .bar-segment.filled1 {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
        }

        .bar-segment.filled2 {
            background: linear-gradient(135deg, #fd79a8, #e84393);
        }

        .bar-segment.result {
            background: linear-gradient(135deg, #00b894, #00cec9);
        }

        .bar-segment.empty {
            background: #ecf0f1;
        }

        .steps-box {
            background: #fff9e6;
            border-left: 5px solid #f39c12;
            padding: 20px;
            border-radius: 0 15px 15px 0;
            margin: 20px 0;
        }

        .steps-box h4 {
            color: #f39c12;
            margin-bottom: 15px;
        }

        .steps-box ol {
            padding-left: 25px;
            line-height: 2;
            color: #2c3e50;
        }

        .presets {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 10px 20px;
            font-size: 1em;
            border: 2px solid #00b894;
            border-radius: 20px;
            cursor: pointer;
            background: white;
            color: #00b894;
            font-weight: bold;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #00b894;
            color: white;
        }
    
        input.invalid {
            border-color: #ffeaa7 !important;
            background: rgba(231, 76, 60, 0.55) !important;
        }

        .msg {
            min-height: 1.5em;
            text-align: center;
            color: #c0392b;
            font-weight: bold;
            margin: 6px 0;
        }

        .bar-segment.neg {
            background: repeating-linear-gradient(45deg, #e74c3c, #e74c3c 6px, #ff8f87 6px, #ff8f87 12px) !important;
        }

        .bar-units {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>➕ Kesir Toplama</h1>
        <p style="text-align:center;color:#666;margin-bottom:10px">Pay negatif olabilir: −½ + ⅓ gibi işlemleri dene!</p>

        <div class="equation">
            <div class="fraction-box">
                <input type="number" id="num1" value="1" min="-99" max="99" step="1" oninput="calculate()" aria-label="Pay">
                <div class="line"></div>
                <input type="number" id="den1" value="4" min="-99" max="99" step="1" oninput="calculate()" aria-label="Payda">
            </div>

            <span class="operator">+</span>

            <div class="fraction-box">
                <input type="number" id="num2" value="2" min="-99" max="99" step="1" oninput="calculate()" aria-label="Pay">
                <div class="line"></div>
                <input type="number" id="den2" value="4" min="-99" max="99" step="1" oninput="calculate()" aria-label="Payda">
            </div>

            <span class="operator">=</span>

            <div class="fraction-box result">
                <span class="val" id="resultNum">3</span>
                <div class="line"></div>
                <span class="val" id="resultDen">4</span>
            </div>
        </div>

        <div class="msg" id="msg" role="status" aria-live="polite"></div>

        <div class="visual-section">
            <h3>📊 Görsel Gösterim</h3>
            <div class="bars-container" id="barsContainer">
                <!-- JavaScript ile doldurulacak -->
            </div>
        </div>

        <div class="steps-box">
            <h4>📝 Çözüm Adımları</h4>
            <ol id="stepsList">
                <!-- JavaScript ile doldurulacak -->
            </ol>
        </div>

        <div class="presets">
            <button class="preset-btn" onclick="setValues(1,4, 2,4)">¼ + 2/4</button>
            <button class="preset-btn" onclick="setValues(1,2, 1,4)">½ + ¼</button>
            <button class="preset-btn" onclick="setValues(2,3, 1,6)">⅔ + ⅙</button>
            <button class="preset-btn" onclick="setValues(1,3, 1,3)">⅓ + ⅓</button>
            <button class="preset-btn" onclick="setValues(3,8, 1,8)">⅜ + ⅛</button>
            <button class="preset-btn" onclick="setValues(-1,2, 1,3)">−½ + ⅓</button>
            <button class="preset-btn" onclick="setValues(-3,4, 3,4)">−¾ + ¾</button>
            <button class="preset-btn" onclick="setValues(-2,3, -1,6)">−⅔ + (−⅙)</button>
        </div>
    </div>

    <script src="rasyonel.js"></script>
    <script>
        const R = Rasyonel, MINUS = R.MINUS;
        ['den1', 'den2'].forEach(id => R.skipZero(document.getElementById(id)));

        function read(i) {
            const ne = document.getElementById('num' + i), de = document.getElementById('den' + i);
            const n = R.readInt(ne), d = R.readInt(de);
            ne.classList.toggle('invalid', n === null);
            de.classList.toggle('invalid', d === null || d === 0);
            if (n === null) return { err: 'Pay ' + i + ' için bir tam sayı gir (negatif olabilir).' };
            if (d === null) return { err: 'Payda ' + i + ' için bir tam sayı gir.' };
            if (d === 0) return { err: 'Payda 0 olamaz!' };
            return { q: R.make(n, d), n, d };
        }

        function createBar(q, className) {
            const neg = q.n < 0, an = Math.abs(q.n), d = q.d;
            const units = Math.max(1, Math.ceil(an / d)), shown = Math.min(units, 4);
            let out = '';
            for (let u = 0; u < shown; u++) {
                let segs = '';
                for (let i = 0; i < d; i++) {
                    const filled = (u * d + i) < an;
                    segs += `<div class="bar-segment ${filled ? (neg ? 'neg' : className) : 'empty'}" style="width:${100 / d}%"></div>`;
                }
                out += `<div class="fraction-bar" style="width:${units > 1 ? 150 : 300}px">${segs}</div>`;
            }
            if (units > shown) out += `<span>… +${units - shown} birim</span>`;
            return `<div class="bar-units">${out}</div>`;
        }

        function calculate() {
            const r1 = read(1), r2 = read(2);
            const msg = document.getElementById('msg');
            if (r1.err || r2.err) {
                msg.textContent = r1.err || r2.err;
                document.getElementById('resultNum').textContent = '?';
                document.getElementById('resultDen').textContent = '?';
                document.getElementById('barsContainer').innerHTML = '';
                document.getElementById('stepsList').innerHTML = '';
                return;
            }
            msg.textContent = (r1.d < 0 || r2.d < 0) ? 'Payda negatifse işareti paya taşırız: −3/5 = 3/−5.' : '';
            const a = r1.q, b = r2.q;
            const L = R.lcm(a.d, b.d);
            const n1 = a.n * (L / a.d), n2 = b.n * (L / b.d), rn = n1 + n2;
            const raw = R.make(rn, L), simp = R.simplify(raw);

            document.getElementById('resultNum').textContent = (simp.n < 0 ? MINUS : '') + Math.abs(simp.n);
            document.getElementById('resultDen').textContent = simp.d;

            const container = document.getElementById('barsContainer');
            container.innerHTML = `
                <div class="bar-row"><span class="bar-label">${R.fmt(a, true)}</span>${createBar(a, 'filled1')}</div>
                <div class="bar-row"><span class="bar-label">+ ${b.n < 0 ? '(' + R.fmt(b, true) + ')' : R.fmt(b, true)}</span>${createBar(b, 'filled2')}</div>
                <div class="bar-row" style="margin-top: 10px; padding-top: 20px; border-top: 3px dashed #bdc3c7;">
                    <span class="bar-label">= ${R.fmt(simp)}</span>${createBar(simp, 'result')}
                </div>`;

            const s1 = Math.sign(n1), s2 = Math.sign(n2);
            let rule = '';
            if (s1 !== 0 && s2 !== 0 && s1 !== s2) rule = `<li>Zıt işaretli: mutlak değerleri çıkar (${Math.max(Math.abs(n1), Math.abs(n2))} ${MINUS} ${Math.min(Math.abs(n1), Math.abs(n2))}); işareti mutlak değeri büyük olan belirler.</li>`;
            else if (s1 !== 0 && s1 === s2) rule = `<li>Aynı işaretli: mutlak değerleri topla, ortak işareti (${s1 < 0 ? MINUS : '+'}) yaz.</li>`;
            const rf = R.fmt(raw), sf = R.fmt(simp);
            const tail = `<li>Sonuç: <strong>${rf}</strong>${rf !== sf ? ` = <strong>${sf}</strong>` : ''}</li>`;
            const steps = document.getElementById('stepsList');
            if (a.d === b.d) {
                steps.innerHTML = `<li>Paydalar aynı: ${a.d} = ${b.d} ✅</li>${rule}<li>Payları topla: ${R.fmt(R.make(n1, 1))} + ${n2 < 0 ? '(' + R.fmt(R.make(n2, 1)) + ')' : n2} = ${rn < 0 ? MINUS + Math.abs(rn) : rn}</li>${tail}`;
            } else {
                steps.innerHTML = `<li>Paydalar farklı: ${a.d} ≠ ${b.d}</li>
                    <li>Ortak payda bul: EKOK(${a.d}, ${b.d}) = ${L}</li>
                    <li>Genişlet: ${R.fmt(a)} = ${R.fmt(R.make(n1, L))}</li>
                    <li>Genişlet: ${R.fmt(b)} = ${R.fmt(R.make(n2, L))}</li>${rule}
                    <li>Payları topla: ${R.fmt(R.make(n1, 1))} + ${n2 < 0 ? '(' + R.fmt(R.make(n2, 1)) + ')' : n2} = ${rn < 0 ? MINUS + Math.abs(rn) : rn}</li>${tail}`;
            }
        }

        function setValues(n1, d1, n2, d2) {
            document.getElementById('num1').value = n1;
            document.getElementById('den1').value = d1;
            document.getElementById('num2').value = n2;
            document.getElementById('den2').value = d2;
            calculate();
        }

        // İlk yükleme
        calculate();
    </script>
<script src="referans_baglanti.js"></script>
</body>

</html>
