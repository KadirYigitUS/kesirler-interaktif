<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✖️ Kesir Çarpma - Alan Modeli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #6c5ce7;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .equation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .fraction-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            border-radius: 15px;
            color: white;
        }

        .fraction-box.second {
            background: linear-gradient(135deg, #fd79a8, #e84393);
        }

        .fraction-box.result {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        }

        .fraction-box input {
            width: 60px;
            height: 45px;
            font-size: 1.8em;
            text-align: center;
            border: 3px solid white;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
        }

        .fraction-box .line {
            width: 60px;
            height: 4px;
            background: white;
            margin: 8px 0;
        }

        .fraction-box .val {
            font-size: 2em;
            font-weight: bold;
        }

        .operator {
            font-size: 3em;
            color: #2c3e50;
            font-weight: bold;
        }

        .visual-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 20px;
            margin: 30px 0;
        }

        .visual-section h3 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .area-model {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .grid-container {
            position: relative;
        }

        .grid {
            display: grid;
            border: 3px solid #2c3e50;
            border-radius: 10px;
            overflow: hidden;
        }

        .grid-cell {
            width: 50px;
            height: 50px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .grid-cell.both {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        }

        .grid-cell.first-only {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            opacity: 0.5;
        }

        .grid-cell.second-only {
            background: linear-gradient(135deg, #fd79a8, #e84393);
            opacity: 0.5;
        }

        .grid-cell.empty {
            background: #f8f9fa;
        }

        .grid-label {
            position: absolute;
            font-weight: bold;
            color: #2c3e50;
        }

        .grid-label.left {
            left: -35px;
            top: 50%;
            transform: translateY(-50%);
        }

        .grid-label.bottom {
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 5px;
        }

        .steps-box {
            background: #f3e8ff;
            border-left: 5px solid #6c5ce7;
            padding: 20px;
            border-radius: 0 15px 15px 0;
            margin: 20px 0;
        }

        .steps-box h4 {
            color: #6c5ce7;
            margin-bottom: 15px;
        }

        .steps-box ol {
            padding-left: 25px;
            line-height: 2;
            color: #2c3e50;
        }

        .presets {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 10px 20px;
            font-size: 1em;
            border: 2px solid #6c5ce7;
            border-radius: 20px;
            cursor: pointer;
            background: white;
            color: #6c5ce7;
            font-weight: bold;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #6c5ce7;
            color: white;
        }
    
        input.invalid {
            border-color: #ffeaa7 !important;
            background: rgba(231, 76, 60, 0.55) !important;
        }

        .msg {
            min-height: 1.5em;
            text-align: center;
            color: #c0392b;
            font-weight: bold;
            margin: 6px 0;
        }

        .bar-segment.neg {
            background: repeating-linear-gradient(45deg, #e74c3c, #e74c3c 6px, #ff8f87 6px, #ff8f87 12px) !important;
        }

        .bar-units {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .grid-cell.both-neg {
            background: repeating-linear-gradient(45deg, #e74c3c, #e74c3c 6px, #ff8f87 6px, #ff8f87 12px);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✖️ Kesir Çarpma - Alan Modeli</h1>
        <p style="text-align:center;color:#666;margin-bottom:10px">Pay negatif olabilir: işaret kuralını alan modelinde ve adımlarda gör.</p>

        <div class="equation">
            <div class="fraction-box">
                <input type="number" id="num1" value="2" min="-12" max="12" step="1" oninput="calculate()" aria-label="Pay">
                <div class="line"></div>
                <input type="number" id="den1" value="3" min="-12" max="12" step="1" oninput="calculate()" aria-label="Payda">
            </div>

            <span class="operator">×</span>

            <div class="fraction-box second">
                <input type="number" id="num2" value="3" min="-12" max="12" step="1" oninput="calculate()" aria-label="Pay">
                <div class="line"></div>
                <input type="number" id="den2" value="4" min="-12" max="12" step="1" oninput="calculate()" aria-label="Payda">
            </div>

            <span class="operator">=</span>

            <div class="fraction-box result">
                <span class="val" id="resultNum">6</span>
                <div class="line"></div>
                <span class="val" id="resultDen">12</span>
            </div>

            <span class="operator">=</span>

            <div class="fraction-box result">
                <span class="val" id="simpleNum">1</span>
                <div class="line"></div>
                <span class="val" id="simpleDen">2</span>
            </div>
        </div>

        <div class="msg" id="msg" role="status" aria-live="polite"></div>

        <div class="visual-section">
            <h3>📐 Alan Modeli</h3>
            <div class="area-model">
                <div class="grid-container">
                    <span class="grid-label left" id="label1">2/3</span>
                    <div class="grid" id="areaGrid">
                        <!-- JavaScript ile doldurulacak -->
                    </div>
                    <span class="grid-label bottom" id="label2">3/4</span>
                </div>

                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe);"></div>
                        <span><strong>Kesişim</strong> = Sonuç</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color"
                            style="background: linear-gradient(135deg, #74b9ff, #0984e3); opacity: 0.5;"></div>
                        <span>Sadece 1. kesir</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color"
                            style="background: linear-gradient(135deg, #fd79a8, #e84393); opacity: 0.5;"></div>
                        <span>Sadece 2. kesir</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #f8f9fa; border: 1px solid #ddd;"></div>
                        <span>Boş</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="steps-box">
            <h4>📝 Çözüm Adımları</h4>
            <ol id="stepsList">
                <!-- JavaScript ile doldurulacak -->
            </ol>
        </div>

        <div class="presets">
            <button class="preset-btn" onclick="setValues(1,2, 1,2)">½ × ½</button>
            <button class="preset-btn" onclick="setValues(2,3, 3,4)">⅔ × ¾</button>
            <button class="preset-btn" onclick="setValues(1,3, 1,4)">⅓ × ¼</button>
            <button class="preset-btn" onclick="setValues(3,4, 2,3)">¾ × ⅔</button>
            <button class="preset-btn" onclick="setValues(1,2, 4,5)">½ × ⅘</button>
            <button class="preset-btn" onclick="setValues(-2,3, 3,4)">−⅔ × ¾</button>
            <button class="preset-btn" onclick="setValues(-1,2, -1,2)">−½ × (−½)</button>
            <button class="preset-btn" onclick="setValues(3,4, -2,3)">¾ × (−⅔)</button>
        </div>
    </div>

    <script src="rasyonel.js"></script>
    <script>
        const R = Rasyonel, MINUS = R.MINUS;
        ['den1', 'den2'].forEach(id => R.skipZero(document.getElementById(id)));

        function read(i) {
            const ne = document.getElementById('num' + i), de = document.getElementById('den' + i);
            const n = R.readInt(ne), d = R.readInt(de);
            ne.classList.toggle('invalid', n === null);
            de.classList.toggle('invalid', d === null || d === 0);
            if (n === null) return { err: 'Pay ' + i + ' için bir tam sayı gir (negatif olabilir).' };
            if (d === null) return { err: 'Payda ' + i + ' için bir tam sayı gir.' };
            if (d === 0) return { err: 'Payda 0 olamaz!' };
            return { q: R.make(n, d), n, d };
        }
        const setSpan = (id, q) => { document.getElementById(id).textContent = (q.n < 0 ? MINUS : '') + Math.abs(q.n); };

        function calculate() {
            const r1 = read(1), r2 = read(2), msg = document.getElementById('msg');
            if (r1.err || r2.err) {
                msg.textContent = r1.err || r2.err;
                ['resultNum', 'resultDen', 'simpleNum', 'simpleDen'].forEach(id => document.getElementById(id).textContent = '?');
                document.getElementById('areaGrid').innerHTML = '';
                document.getElementById('stepsList').innerHTML = '';
                return;
            }
            const a = r1.q, b = r2.q;
            const raw = R.mul(a, b), simp = R.simplify(raw);
            const sr = Math.sign(raw.n);

            document.getElementById('resultNum').textContent = (raw.n < 0 ? MINUS : '') + Math.abs(raw.n);
            document.getElementById('resultDen').textContent = raw.d;
            document.getElementById('simpleNum').textContent = (simp.n < 0 ? MINUS : '') + Math.abs(simp.n);
            document.getElementById('simpleDen').textContent = simp.d;

            document.getElementById('label1').textContent = R.fmt(a, true);
            document.getElementById('label2').textContent = R.fmt(b, true);

            // Alan modeli: |pay| ≤ payda olan kesirler için (0–1 arası); işaret ayrıca kuralla bulunur
            const grid = document.getElementById('areaGrid');
            const fits = Math.abs(a.n) <= a.d && Math.abs(b.n) <= b.d;
            if (fits) {
                msg.textContent = (r1.d < 0 || r2.d < 0) ? 'Payda negatifse işareti paya taşırız: −3/5 = 3/−5.' : '';
                grid.style.gridTemplateColumns = `repeat(${b.d}, 50px)`;
                grid.style.gridTemplateRows = `repeat(${a.d}, 50px)`;
                let html = '';
                for (let row = 0; row < a.d; row++) {
                    for (let col = 0; col < b.d; col++) {
                        const inFirst = row < Math.abs(a.n), inSecond = col < Math.abs(b.n);
                        let className = 'grid-cell ';
                        if (inFirst && inSecond) className += sr < 0 ? 'both-neg' : 'both';
                        else if (inFirst) className += 'first-only';
                        else if (inSecond) className += 'second-only';
                        else className += 'empty';
                        html += `<div class="${className}"></div>`;
                    }
                }
                grid.innerHTML = html;
            } else {
                msg.textContent = 'Alan modeli yalnızca |pay| ≤ payda olan kesirler için çizilir; adımlar yine de doğru hesaplanır.';
                grid.innerHTML = '';
            }

            const sa = Math.sign(a.n), sb = Math.sign(b.n);
            const rule = (sa === 0 || sb === 0) ? 'Çarpanlardan biri 0 olduğu için çarpım 0\'dır.'
                : sa === sb ? 'Aynı işaretlerin çarpımı pozitiftir.' : 'Zıt işaretlerin çarpımı negatiftir.';
            const rf = R.fmt(raw), sf = R.fmt(simp);
            document.getElementById('stepsList').innerHTML = `
                <li>İşaret kuralı: ${rule}</li>
                <li>Payları çarp: ${a.n < 0 ? '(' + R.fmt(R.make(a.n, 1)) + ')' : a.n} × ${b.n < 0 ? '(' + R.fmt(R.make(b.n, 1)) + ')' : b.n} = <strong>${raw.n < 0 ? MINUS + Math.abs(raw.n) : raw.n}</strong></li>
                <li>Paydaları çarp: ${a.d} × ${b.d} = <strong>${raw.d}</strong></li>
                <li>Sonuç: <strong>${rf}</strong></li>
                ${rf !== sf ? `<li>Sadeleştir: ${rf} = <strong>${sf}</strong></li>` : ''}
                ${fits ? `<li>Alan modeli: ${raw.d} kareden ${Math.abs(raw.n)} tanesi kesişim (${sr < 0 ? 'negatif işaret kuralıyla kırmızı çizgili' : 'mor'})</li>` : ''}
            `;
        }

        function setValues(n1, d1, n2, d2) {
            document.getElementById('num1').value = n1;
            document.getElementById('den1').value = d1;
            document.getElementById('num2').value = n2;
            document.getElementById('den2').value = d2;
            calculate();
        }

        // İlk yükleme
        calculate();
    </script>
</body>

</html>
