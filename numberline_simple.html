<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📏 Basit Sayı Doğrusu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #0984e3;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .numberline-box {
            background: #f8f9fa;
            padding: 40px 20px;
            border-radius: 20px;
            margin: 20px 0;
        }

        #numberlineCanvas {
            display: block;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .slider-group {
            text-align: center;
        }

        .slider-group label {
            display: block;
            font-size: 1.2em;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .slider-group input[type="range"] {
            width: 200px;
            height: 15px;
            -webkit-appearance: none;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            border-radius: 10px;
            outline: none;
        }

        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: white;
            border: 4px solid #0984e3;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        .slider-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #0984e3;
            margin-top: 10px;
        }

        .fraction-display {
            text-align: center;
            margin: 30px 0;
        }

        .big-fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #0984e3, #74b9ff);
            padding: 20px 50px;
            border-radius: 20px;
            color: white;
        }

        .big-fraction .num {
            font-size: 4em;
            font-weight: bold;
            line-height: 1;
        }

        .big-fraction .line {
            width: 100%;
            height: 6px;
            background: white;
            margin: 10px 0;
            border-radius: 3px;
        }

        .big-fraction .den {
            font-size: 4em;
            font-weight: bold;
            line-height: 1;
        }

        .values {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .value-box {
            background: #f8f9fa;
            padding: 15px 30px;
            border-radius: 15px;
            text-align: center;
        }

        .value-box .label {
            font-size: 0.9em;
            color: #666;
        }

        .value-box .val {
            font-size: 1.8em;
            font-weight: bold;
            color: #2c3e50;
        }

        .presets {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .preset-btn {
            padding: 12px 25px;
            font-size: 1.3em;
            border: 3px solid #0984e3;
            border-radius: 25px;
            cursor: pointer;
            background: white;
            color: #0984e3;
            font-weight: bold;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #0984e3;
            color: white;
            transform: scale(1.1);
        }

        .info-box {
            background: #e8f4f8;
            border-left: 5px solid #0984e3;
            padding: 20px;
            border-radius: 0 15px 15px 0;
            margin-top: 20px;
        }

        .info-box p {
            color: #2c3e50;
            font-size: 1.1em;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📏 Basit Sayı Doğrusu</h1>
        <p class="subtitle">Kaydırıcıları hareket ettir ve kesrin sayı doğrusundaki yerini gör!</p>

        <div class="numberline-box">
            <canvas id="numberlineCanvas" width="800" height="150"></canvas>
        </div>

        <div class="controls">
            <div class="slider-group">
                <label>PAY (Üstteki Sayı — negatif olabilir)</label>
                <input type="range" id="numSlider" min="-50" max="50" step="1" value="3" aria-label="Pay (negatif olabilir)">
                <div class="slider-value" id="numValue">3</div>
            </div>

            <div class="slider-group">
                <label>PAYDA (Alttaki Sayı)</label>
                <input type="range" id="denSlider" min="1" max="12" value="4">
                <div class="slider-value" id="denValue">4</div>
            </div>
        </div>

        <div class="fraction-display">
            <div class="big-fraction">
                <span class="num" id="bigNum">3</span>
                <div class="line"></div>
                <span class="den" id="bigDen">4</span>
            </div>
        </div>

        <div class="values">
            <div class="value-box">
                <div class="label">Ondalık</div>
                <div class="val" id="decimal">0.75</div>
            </div>
            <div class="value-box">
                <div class="label">Yüzde</div>
                <div class="val" id="percent">75%</div>
            </div>
            <div class="value-box">
                <div class="label">Konum</div>
                <div class="val" id="position">0 ile 1 arası</div>
            </div>
        </div>

        <div class="presets">
            <button class="preset-btn" onclick="toggleFullLine(this)">↔ Tüm doğru (−50 … +50)</button>
            <button class="preset-btn" onclick="setFraction(1,2)">½</button>
            <button class="preset-btn" onclick="setFraction(1,4)">¼</button>
            <button class="preset-btn" onclick="setFraction(3,4)">¾</button>
            <button class="preset-btn" onclick="setFraction(1,3)">⅓</button>
            <button class="preset-btn" onclick="setFraction(2,3)">⅔</button>
            <button class="preset-btn" onclick="setFraction(5,8)">⅝</button>
            <button class="preset-btn" onclick="setFraction(7,4)">7/4</button>
            <button class="preset-btn" onclick="setFraction(-1,2)">−½</button>
            <button class="preset-btn" onclick="setFraction(-3,4)">−¾</button>
            <button class="preset-btn" onclick="setFraction(-7,3)">−7/3</button>
            <button class="preset-btn" onclick="setFraction(-50,1)">−50</button>
            <button class="preset-btn" onclick="setFraction(50,1)">50</button>
        </div>

        <div class="info-box">
            <p id="infoText">
                <strong>3/4</strong> kesri, 0 ile 1 arasında, 1'e daha yakın bir konumdadır.
                Payda (4), bütünün kaç parçaya bölündüğünü; pay (3), kaç parça aldığımızı gösterir.
            </p>
        </div>
    </div>

    <script src="rasyonel.js"></script>
    <script src="sayi_dogrusu_slider.js"></script>
    <script>
        SliderNumberLine.init({
            canvas: 'numberlineCanvas', numSlider: 'numSlider', denSlider: 'denSlider',
            numVal: 'numValue', denVal: 'denValue', bigNum: 'bigNum', bigDen: 'bigDen',
            decimal: 'decimal', percent: 'percent', position: 'position', infoText: 'infoText'
        });
    </script>
<script src="referans_baglanti.js"></script>
</body>

</html>
