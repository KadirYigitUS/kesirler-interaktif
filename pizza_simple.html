<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍕 Basit Pizza Kesiri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff6b6b 0%, #c0392b 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #c0392b;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .slider-group {
            text-align: center;
        }

        .slider-group label {
            display: block;
            font-size: 1.2em;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .slider-group input[type="range"] {
            width: 200px;
            height: 15px;
            cursor: pointer;
        }

        .slider-group .value {
            font-size: 2em;
            font-weight: bold;
            color: #c0392b;
            margin-top: 10px;
        }

        .pizza-container {
            display: flex;
            justify-content: center;
            margin: 30px 0;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .fraction-display {
            text-align: center;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            padding: 25px;
            border-radius: 20px;
            margin-top: 20px;
        }

        .fraction-display .main {
            font-size: 3.5em;
            font-weight: bold;
        }

        .fraction-display .details {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            font-size: 1.2em;
        }

        .presets {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .preset-btn {
            padding: 12px 24px;
            font-size: 1.1em;
            border: 3px solid #c0392b;
            border-radius: 25px;
            cursor: pointer;
            background: white;
            color: #c0392b;
            font-weight: bold;
            transition: all 0.3s;
        }

        .preset-btn:hover {
            background: #c0392b;
            color: white;
            transform: scale(1.05);
        }

        .info-box {
            background: #fff5f5;
            border-left: 5px solid #c0392b;
            padding: 20px;
            border-radius: 0 15px 15px 0;
            margin-top: 25px;
        }

        .info-box h4 {
            color: #c0392b;
            margin-bottom: 10px;
        }
    
        .neg-note {
            text-align: center;
            color: #8e44ad;
            font-weight: 600;
            margin: 8px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🍕 Pizza Kesiri</h1>
        <p class="subtitle">Pizzayı kesirlerle paylaş! Payı negatif yaparsan dilimler <b>borç</b> olur.</p>

        <div class="controls">
            <div class="slider-group">
                <label>🍴 Alınan (+) / Borç (−) Dilim (Pay)</label>
                <input type="range" id="numSlider" min="-8" max="8" step="1" value="3" aria-label="Pay: negatif değerler borç dilimidir">
                <div class="value" id="numVal">3</div>
            </div>

            <div class="slider-group">
                <label>🔪 Toplam Dilim (Payda)</label>
                <input type="range" id="denSlider" min="1" max="12" value="8">
                <div class="value" id="denVal">8</div>
            </div>
        </div>

        <div class="pizza-container">
            <canvas id="pizzaCanvas" width="400" height="400"></canvas>
        </div>

        <div class="fraction-display">
            <div class="main" id="fractionText">3/8</div>
            <div class="details">
                <span>📊 <span id="percentText">37.5%</span></span>
                <span>🔢 <span id="decimalText">0.375</span></span>
            </div>
        </div>

        <div class="info-box" id="infoBox">
            <h4>💡 Bilgi</h4>
            <p id="infoText">Pizza 8 eşit dilime bölündü. 3 dilim alındı.</p>
        </div>

        <div class="presets">
            <button class="preset-btn" onclick="setFraction(1,2)">Yarısı ½</button>
            <button class="preset-btn" onclick="setFraction(1,4)">Çeyreği ¼</button>
            <button class="preset-btn" onclick="setFraction(3,4)">¾</button>
            <button class="preset-btn" onclick="setFraction(1,8)">⅛</button>
            <button class="preset-btn" onclick="setFraction(5,8)">⅝</button>
            <button class="preset-btn" onclick="setFraction(2,3)">⅔</button>
            <button class="preset-btn" onclick="setFraction(-1,4)">−¼</button>
            <button class="preset-btn" onclick="setFraction(-1,2)">−½</button>
            <button class="preset-btn" onclick="setFraction(-3,8)">−⅜</button>
            <button class="preset-btn" onclick="setFraction(-2,3)">−⅔</button>
        </div>
    </div>

    <script src="rasyonel.js"></script>
    <script>
        const R = Rasyonel;
        const canvas = document.getElementById('pizzaCanvas');
        const ctx = canvas.getContext('2d');
        const numSlider = document.getElementById('numSlider');
        const denSlider = document.getElementById('denSlider');

        function drawPizza() {
            const num = parseInt(numSlider.value);
            const den = parseInt(denSlider.value);

            // Pay, paydadan büyük olamaz (pizza kontrolü)
            if (num > den || num < -den) {
                numSlider.value = Math.max(-den, Math.min(den, num));
                return drawPizza();
            }
            const an = Math.abs(num);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 180;

            // Pizza tabanı (hamur)
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 10, 0, Math.PI * 2);
            ctx.fillStyle = '#d4a574';
            ctx.fill();

            // Dilimler çiz
            const sliceAngle = (Math.PI * 2) / den;

            for (let i = 0; i < den; i++) {
                const startAngle = i * sliceAngle - Math.PI / 2;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();

                // Alınan dilimler kırmızı, alınmayanlar gri
                if (num < 0 && i < an) {
                    // BORÇ dilimi: kesikli çizgili, mor, eksi işaretli
                    ctx.fillStyle = '#e8daef';
                    ctx.fill();
                    ctx.save();
                    ctx.setLineDash([8, 6]);
                    ctx.strokeStyle = '#8e44ad';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                    const mA = startAngle + sliceAngle / 2;
                    ctx.fillStyle = '#8e44ad';
                    ctx.font = 'bold 34px "Segoe UI", Arial, sans-serif';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('\u2212', centerX + Math.cos(mA) * radius * 0.6, centerY + Math.sin(mA) * radius * 0.6);
                    ctx.textBaseline = 'alphabetic';
                } else if (num > 0 && i < num) {
                    // Peynirli pizza
                    ctx.fillStyle = '#f39c12';
                    ctx.fill();

                    // Sos
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius * 0.9, startAngle + 0.02, endAngle - 0.02);
                    ctx.closePath();
                    ctx.fillStyle = '#e74c3c';
                    ctx.fill();

                    // Peynir
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius * 0.8, startAngle + 0.04, endAngle - 0.04);
                    ctx.closePath();
                    ctx.fillStyle = '#ffeaa7';
                    ctx.fill();

                    // Pepperoni
                    const midAngle = startAngle + sliceAngle / 2;
                    const pepX = centerX + Math.cos(midAngle) * radius * 0.5;
                    const pepY = centerY + Math.sin(midAngle) * radius * 0.5;
                    ctx.beginPath();
                    ctx.arc(pepX, pepY, 10, 0, Math.PI * 2);
                    ctx.fillStyle = '#c0392b';
                    ctx.fill();
                } else {
                    // Boş dilim (alınmamış)
                    ctx.fillStyle = '#bdc3c7';
                    ctx.fill();
                }

                // Dilim sınırları
                ctx.strokeStyle = '#2c3e50';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Merkez daire (pizza soslu kısım)
            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();

            // Değerleri güncelle
            const q = R.make(num, den);
            document.getElementById('numVal').textContent = (num < 0 ? '\u2212' : '') + an;
            document.getElementById('denVal').textContent = den;
            document.getElementById('fractionText').textContent = R.fmt(q);
            document.getElementById('decimalText').textContent = R.decimalStr(q);
            document.getElementById('percentText').textContent = R.percentStr(q).replace(/^(\u2212?)(.*)%$/, '$1%$2');

            // Bilgi metni
            const infoText = document.getElementById('infoText');
            if (num < 0) {
                infoText.textContent = `Pizza ${den} eşit dilime bölündü. ${an} dilim BORÇ (kesikli mor dilimler): ${R.fmt(q)}. ` +
                    `Negatif kesir, "alınan"ın tersi yöndür; sayı doğrusunda 0'ın soluna denk gelir. |${R.fmt(q)}| = ${R.fmt(R.abs(q))}.`;
            } else if (num === 0) {
                infoText.textContent = `Pizza ${den} dilime bölündü ama hiç dilim alınmadı! 🙁`;
            } else if (num === den) {
                infoText.textContent = `Tüm pizza alındı! ${den}/${den} = 1 tam pizza 🍕`;
            } else if (num === 1) {
                infoText.textContent = `Pizza ${den} dilime bölündü. Sadece 1 dilim alındı.`;
            } else {
                infoText.textContent = `Pizza ${den} eşit dilime bölündü. ${num} dilim alındı.`;
            }
        }

        function setFraction(num, den) {
            denSlider.value = den;
            numSlider.max = den;
            numSlider.min = -den;
            numSlider.value = num;
            drawPizza();
        }

        numSlider.addEventListener('input', drawPizza);
        denSlider.addEventListener('input', function () {
            numSlider.max = this.value;
            numSlider.min = -this.value;
            drawPizza();
        });

        // İlk çizim
        drawPizza();
    </script>
</body>

</html>
